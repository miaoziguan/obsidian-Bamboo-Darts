<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bamboo Darts 叶子图标候选</title>
<style>
  :root { --bg: #0f1115; --card: #1a1d24; --fg: #e6e8ec; --muted: #8a909c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px;
    font-family: -apple-system, 'SF Pro', system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; align-items: center; gap: 40px;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: -28px; }
  .grid { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .card {
    background: var(--card); border-radius: 16px; padding: 28px 28px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    width: 200px; border: 1px solid rgba(255,255,255,0.06);
  }
  .card .row { display: flex; gap: 10px; align-items: flex-end; }
  .card .ico { color: #cfd3da; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .tag { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.5; }
  .sizes { display: flex; gap: 12px; align-items: flex-end; }
  .sizes svg { color: #cfd3da; }
  /* hover 呼应品牌色 */
  .card:hover .ico { color: #6ecf8e; transition: color .15s ease; }
</style>
</head>
<body>
  <h1>Bamboo Darts · 面板标题栏叶子图标候选</h1>
  <div class="sub">stroke-only / 1.6px / round caps · 区别于 Obsidian 内置 leaf</div>

  <div class="grid">

    <!-- 方案 A：竹叶飞刃（双叶交叉 + 飞刃尖） -->
    <div class="card">
      <div class="row">
        <svg class="ico" width="40" height="40" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20 C7 13 11 8 20 4 C16 12 12 17 4 20 Z" />
          <path d="M20 4 L20 4" />
          <path d="M5 19 C9 16 14 12 19 7" />
          <path d="M4 20 C9 17 14 13 19 7 C13 12 8 16 4 20 Z" />
        </svg>
      </div>
      <div class="name">A · 竹叶飞刃</div>
      <div class="tag">双叶交叉<br/>锋利收尖，呼应「飞刃」</div>
      <div class="sizes">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 C7 13 11 8 20 4 C16 12 12 17 4 20 Z"/><path d="M5 19 C9 16 14 12 19 7"/><path d="M4 20 C9 17 14 13 19 7 C13 12 8 16 4 20 Z"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 C7 13 11 8 20 4 C16 12 12 17 4 20 Z"/><path d="M5 19 C9 16 14 12 19 7"/><path d="M4 20 C9 17 14 13 19 7 C13 12 8 16 4 20 Z"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 C7 13 11 8 20 4 C16 12 12 17 4 20 Z"/><path d="M5 19 C9 16 14 12 19 7"/><path d="M4 20 C9 17 14 13 19 7 C13 12 8 16 4 20 Z"/></svg>
      </div>
    </div>

    <!-- 方案 B：单叶脉（叶片 + 主脉 + 侧脉） -->
    <div class="card">
      <svg class="ico" width="40" height="40" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 19 C5 11 11 4 21 4 C21 14 14 19 5 19 Z" />
        <path d="M5 19 C10 15 16 10 21 4" />
        <path d="M10 16 L13 12" />
        <path d="M13 15 L17 11" />
        <path d="M8 14 L9 10" />
      </svg>
      <div class="name">B · 单叶脉</div>
      <div class="tag">有机叶片轮廓<br/>内描主脉与侧脉</div>
      <div class="sizes">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 C5 11 11 4 21 4 C21 14 14 19 5 19 Z"/><path d="M5 19 C10 15 16 10 21 4"/><path d="M10 16 L13 12"/><path d="M13 15 L17 11"/><path d="M8 14 L9 10"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 C5 11 11 4 21 4 C21 14 14 19 5 19 Z"/><path d="M5 19 C10 15 16 10 21 4"/><path d="M10 16 L13 12"/><path d="M13 15 L17 11"/><path d="M8 14 L9 10"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 C5 11 11 4 21 4 C21 14 14 19 5 19 Z"/><path d="M5 19 C10 15 16 10 21 4"/><path d="M10 16 L13 12"/><path d="M13 15 L17 11"/><path d="M8 14 L9 10"/></svg>
      </div>
    </div>

    <!-- 方案 C：卷叶（专业版 · 单闭合轮廓 + 内卷螺旋 + 中轴主脉） -->
    <div class="card">
      <svg class="ico" width="40" height="40" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 19
                 C4 14 6 8 12 5.5
                 C16 4 19 5.5 19 8.5
                 C19 11 16.5 12.5 14.5 11.5
                 C13 10.8 13.2 8.8 15 8.5
                 C16.4 8.3 17.2 9.4 16.6 10.4
                 C15.6 12 12.5 12.5 10 14
                 C7.5 15.5 6 17.5 5 19 Z" />
        <path d="M5.4 18.4 C7 14.5 9.5 10.5 13.5 8.2" />
      </svg>
      <div class="name">C · 卷叶（专业版）</div>
      <div class="tag">单闭合轮廓<br/>内卷螺旋 + 中轴主脉</div>
      <div class="sizes">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 C4 14 6 8 12 5.5 C16 4 19 5.5 19 8.5 C19 11 16.5 12.5 14.5 11.5 C13 10.8 13.2 8.8 15 8.5 C16.4 8.3 17.2 9.4 16.6 10.4 C15.6 12 12.5 12.5 10 14 C7.5 15.5 6 17.5 5 19 Z"/><path d="M5.4 18.4 C7 14.5 9.5 10.5 13.5 8.2"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 C4 14 6 8 12 5.5 C16 4 19 5.5 19 8.5 C19 11 16.5 12.5 14.5 11.5 C13 10.8 13.2 8.8 15 8.5 C16.4 8.3 17.2 9.4 16.6 10.4 C15.6 12 12.5 12.5 10 14 C7.5 15.5 6 17.5 5 19 Z"/><path d="M5.4 18.4 C7 14.5 9.5 10.5 13.5 8.2"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 C4 14 6 8 12 5.5 C16 4 19 5.5 19 8.5 C19 11 16.5 12.5 14.5 11.5 C13 10.8 13.2 8.8 15 8.5 C16.4 8.3 17.2 9.4 16.6 10.4 C15.6 12 12.5 12.5 10 14 C7.5 15.5 6 17.5 5 19 Z"/><path d="M5.4 18.4 C7 14.5 9.5 10.5 13.5 8.2"/></svg>
      </div>
    </div>

  </div>
</body>
</html>
